# Public URL: https://neon-drift-aphiwe.abacusai.cloud
# Serves the Godot web export from build/web (static files only).
server {
    listen 80;
    server_name neon-drift-aphiwe.vm.internal;
    root /home/ubuntu/neon-portfolio-game/build/web;
    index index.html;

    types {
        text/html                html;
        application/javascript   js;
        application/wasm         wasm;
        application/octet-stream pck;
        image/png                png;
        image/svg+xml            svg;
    }

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream;
    gzip_min_length 1024;

    add_header Cache-Control "max-age=0, s-maxage=60" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai" always;

    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
